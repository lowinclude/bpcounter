<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Фарм BP</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="app-toolbar" aria-label="Управление прогрессом">
        <div class="score-panel">
          <div class="manual-bp-control">
            <span class="score-panel__label">Убрать</span>
            <button
              id="removeManualBpBtn"
              class="button button--success manual-bp-control__button"
              type="button"
            >
              -4 BP
            </button>
          </div>

          <label class="score-panel__field" aria-label="Начальное значение BP">
            <input
              id="startBpInput"
              class="score-input"
              type="number"
              placeholder="0"
              inputmode="numeric"
            />
          </label>

          <div class="manual-bp-control">
            <span class="score-panel__label">Добавить</span>
            <button
              id="addManualBpBtn"
              class="button button--success manual-bp-control__button"
              type="button"
            >
              +4 BP
            </button>
          </div>

          <div class="score-total">
            <span class="score-panel__label">Итого</span>
            <div id="totalBp" class="score-badge" aria-live="polite">0 BP</div>
          </div>

          <button
            id="resetManualBtn"
            class="button button--danger"
            type="button"
            title="Сбросить только ручной счетчик"
            aria-label="Сбросить ручной счетчик"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4.5 8.5V4.75m0 0h3.75m-3.75 0 2.7 2.7A7.5 7.5 0 1 1 4.9 15" />
              <path d="M9 12h6" />
            </svg>
          </button>
        </div>

        <div class="toolbar-actions" aria-label="Фильтры и действия">
          <button id="toggleX2" class="button" type="button">X2</button>
          <button id="toggleFav" class="button" type="button">★ Избранное</button>
          <button id="toggleEdit" class="button" type="button">✎ Редактировать</button>
          <button id="newDay" class="button" type="button">↺ Новый день</button>
          <button id="addCatBtn" class="button" type="button">+ Категория</button>
        </div>
      </section>

      <section id="board" class="task-board" aria-label="Список заданий"></section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
